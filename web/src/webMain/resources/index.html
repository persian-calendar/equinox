<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>شمارش معکوس تا نوروز</title>
	<meta name="description" content="شمارش معکوس تا لحظهٔ اعتدال بهاری (نوروز) با محاسبهٔ دقیق کتابخانهٔ Equinox">
	<link rel="manifest" href="manifest.webmanifest">
	<meta name="theme-color" content="#d3ecdf" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#05060f" media="(prefers-color-scheme: dark)">
	<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
	<link rel="icon" type="image/png" href="icons/icon-192.png">
	<link rel="apple-touch-icon" href="icons/icon-192.png">
	<style>
/* Spring when the system asks for light: new grass and a pale green sky, the season the
   countdown is heading into. The dark palette below is the original night version,
   unchanged. */
:root {
	color-scheme: light dark;
	--bg-top: #d3ecdf;
	--bg-mid: #e2f4e3;
	--bg-low: #eef7d8;
	--bg-horizon: #cbe8a8;
	--text: #132a1d;
	--muted: #47614f;
	--accent: #1c6b46;
	--gold: #a45c07;
	--card-top: #ffffff;
	--card-bottom: #e9f4e8;
	--card-shadow: rgba(20, 60, 40, .2);
	--card-ring: rgba(30, 80, 55, .12);
	--digit-top: #1d3a2c;
	--digit-1: #2c5040;
	--digit-2: #1d3a2c;
	--digit-3: #234a37;
	--digit-4: #15302a;
	--sun-a: rgba(255, 226, 140, .6);
	--sun-b: rgba(255, 198, 96, .26);
	--horizon-a: rgba(150, 210, 120, .35);
	--horizon-b: rgba(120, 195, 100, .5);
	--track: rgba(19, 42, 29, .12);
	--track-from: #1c6b46;
	--track-to: #d08a1e;
	--gold-border: rgba(164, 92, 7, .45);
	--gold-soft: rgba(210, 140, 40, .16);
	--imminent-ring: rgba(184, 106, 8, .62);
	--imminent-glow: rgba(255, 146, 34, .72);
	--digit-glow: rgba(190, 110, 15, .75);
	--star-1: rgba(60, 120, 85, .45);
	--star-2: rgba(80, 132, 98, .38);
	--star-3: rgba(96, 140, 96, .32);
	--star-4: rgba(58, 112, 80, .42);
	--star-5: rgba(104, 138, 88, .34);
	--star-6: rgba(70, 124, 92, .28);
	--glow: 0;
	--progress: 0;
	--fade: 260ms;
}

@media (prefers-color-scheme: dark) {
	:root {
		--bg-top: #05060f;
		--bg-mid: #140d29;
		--bg-low: #2b1039;
		--bg-horizon: #4a1636;
		--text: #f4efff;
		--muted: #a79fc6;
		--accent: #7c9cff;
		--gold: #ffc35c;
		--card-top: #241d3d;
		--card-bottom: #17122a;
		--card-shadow: rgba(0, 0, 0, .95);
		--card-ring: rgba(255, 255, 255, .07);
		--digit-top: #fff8f2;
		--digit-1: #fffaf3;
		--digit-2: #ffe9c4;
		--digit-3: #e2d6ff;
		--digit-4: #c3b3ee;
		--sun-a: rgba(255, 168, 74, .5);
		--sun-b: rgba(255, 112, 62, .18);
		--horizon-a: rgba(255, 138, 72, .1);
		--horizon-b: rgba(255, 176, 96, .24);
		--track: rgba(255, 255, 255, .09);
		--track-from: #7c9cff;
		--track-to: #ffc35c;
		--gold-border: rgba(255, 195, 92, .45);
		--gold-soft: rgba(255, 195, 92, .12);
		--imminent-ring: rgba(255, 195, 92, .5);
		--imminent-glow: rgba(255, 170, 70, .55);
		--digit-glow: rgba(255, 178, 72, .8);
		--star-1: rgba(255, 255, 255, .95);
		--star-2: rgba(226, 236, 255, .8);
		--star-3: rgba(255, 250, 240, .7);
		--star-4: rgba(205, 222, 255, .85);
		--star-5: rgba(255, 236, 205, .75);
		--star-6: rgba(255, 255, 255, .6);
	}
}

* { box-sizing: border-box; }

@font-face {
	font-family: 'MarkaziTextDigits';
	src: url('MarkaziTextDigits-VariableFont_wght.ttf') format('truetype');
	font-weight: 400 700;
	font-style: normal;
	font-display: swap;
}

body {
	margin: 0;
	min-height: 100%;
	background: #05060f;
	background: var(--bg-top);
	color: #f4efff;
	color: var(--text);
	font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, 'Noto Sans Arabic', sans-serif;
	-webkit-text-size-adjust: 100%;
}

/* The sky is decoration only; it may fall back to a flat background without
   affecting the countdown. */
.sky {
	position: fixed;
	inset: 0;
	z-index: 0;
	overflow: hidden;
	background: var(--bg-top);
	background: linear-gradient(180deg, var(--bg-top), var(--bg-mid) 42%, var(--bg-low) 74%, var(--bg-horizon));
}

.sky__stars {
	position: absolute;
	inset: 0;
	opacity: .55;
	background-image:
		radial-gradient(circle at 12% 18%, var(--star-1) 0 1.1px, transparent 1.7px),
		radial-gradient(circle at 68% 9%, var(--star-2) 0 1px, transparent 1.6px),
		radial-gradient(circle at 39% 47%, var(--star-3) 0 .9px, transparent 1.4px),
		radial-gradient(circle at 84% 39%, var(--star-4) 0 1.2px, transparent 1.8px),
		radial-gradient(circle at 22% 72%, var(--star-5) 0 1px, transparent 1.5px),
		radial-gradient(circle at 93% 83%, var(--star-6) 0 .9px, transparent 1.4px);
	background-size: 340px 300px;
	animation: twinkle 8s ease-in-out infinite alternate;
}

.sky__glow {
	position: absolute;
	left: 50%;
	bottom: -40vmax;
	width: 175vmax;
	height: 105vmax;
	margin-left: -87.5vmax;
	background: radial-gradient(closest-side, var(--sun-a), var(--sun-b) 46%, transparent 72%);
	opacity: .3;
	opacity: calc(.25 + var(--glow) * .75);
	animation: breathe 11s ease-in-out infinite;
}

.sky__horizon {
	position: absolute;
	left: 0;
	right: 0;
	bottom: 0;
	height: 30vh;
	background: linear-gradient(180deg, transparent, var(--horizon-a) 62%, var(--horizon-b));
}

@keyframes twinkle {
	from { opacity: .35; }
	to { opacity: .7; }
}

@keyframes breathe {
	0%, 100% { transform: scale(1); }
	50% { transform: scale(1.06); }
}

#app {
	position: relative;
	display: flex;
	flex-direction: column;
	min-height: 100vh;
	min-height: 100dvh;
}

.stage {
	position: relative;
	z-index: 1;
	display: flex;
	flex: 1;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 1.5rem;
	padding: 3rem 1.25rem 1.5rem;
	text-align: center;
}

.kicker {
	margin: 0;
	font-size: .74rem;
	font-weight: 600;
	/* letter-spacing: .3em; */
	color: #a79fc6;
	color: var(--muted);
}

.title {
	margin: -.6rem 0 0;
	font-size: 2.6rem;
	font-size: clamp(1.75rem, 5.5vw, 2.75rem);
	font-weight: 800;
	line-height: 1.15;
}

.title__year {
	color: #ffc35c;
	color: var(--gold);
}

.subtitle {
	margin: 0;
	max-width: 34rem;
	font-size: .95rem;
	font-size: clamp(.85rem, 2.4vw, 1rem);
	line-height: 1.9;
	color: #a79fc6;
	color: var(--muted);
}

.subtitle time {
	color: #f4efff;
	color: var(--text);
}

.clock {
	display: flex;
	flex-wrap: wrap;
	align-items: flex-start;
	justify-content: center;
	gap: 1.6rem 1.9rem;
	gap: clamp(.9rem, 3vw, 1.9rem);
	--card-w: 4.6rem;
	--card-h: 6.4rem;
	--card-w: clamp(2.4rem, 8.6vw, 4.6rem);
	--card-h: clamp(3.4rem, 12.5vw, 6.4rem);
}

.unit {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: .65rem;
}

.cards {
	display: flex;
	/* Digits are always written left to right, even inside an RTL page. */
	direction: ltr;
	gap: .35rem;
	gap: clamp(.2rem, 1vw, .45rem);
}

.unit__label {
	font-size: .78rem;
	font-weight: 600;
	/* letter-spacing: .16em; */
	color: #a79fc6;
	color: var(--muted);
}

.unit__label small {
	display: block;
	margin-top: .1rem;
	font-size: .62rem;
	font-weight: 500;
	/* letter-spacing: .22em; */
	text-transform: uppercase;
	opacity: .65;
}

.card {
	position: relative;
	/* The card is the window the digits roll inside: the travel is most of the
	   card's height, so without this the digits would spill over their
	   neighbours. */
	overflow: hidden;
	width: 4.6rem;
	width: var(--card-w);
	height: 6.4rem;
	height: var(--card-h);
	font-size: 7rem;
	font-size: calc(var(--card-h) * 1.08);
	font-weight: 800;
	line-height: 1;
	border-radius: 16px;
	background: #17122a;
	background: var(--card-bottom);
	box-shadow:
		0 16px 26px -18px var(--card-shadow),
		0 0 0 1px var(--card-ring);
	transition: box-shadow .5s;
}

/* The card is drawn as two halves, like a split flap board. The digits are each a
   single piece that sits on top of them and rolls, so a digit always reads as one
   glyph on the way in and on the way out. */
.shade {
	position: absolute;
	left: 0;
	right: 0;
	height: 50%;
	background: #241d3d;
	background: var(--card-top);
}

.shade--top {
	top: 0;
	border-radius: 16px 16px 0 0;
}

.shade--bottom {
	bottom: 0;
	border-radius: 0 0 16px 16px;
	background: #17122a;
	background: var(--card-bottom);
}

.digit {
	position: absolute;
	top: 0;
	right: 0;
	bottom: 0;
	left: 0;
	display: flex;
	align-items: center;
	justify-content: center;
	font-family: 'MarkaziTextDigits', Georgia, 'Times New Roman', serif;
	font-weight: 700;
	line-height: 1;
	color: #fff8f2;
	color: var(--digit-top);
	font-variant-numeric: tabular-nums;
}

.digit::before { content: attr(data-v); }

/* The previous digit sits under the digit that replaces it; the two crossfade,
   and where the easing functions below exist they also roll. The current digit
   comes later in the markup, so it is the one on top. */
.digit--previous {
	opacity: 0;
}

/* The four channels of the roll, and the measured curves they run on:

     offset  dy = .59375 * (1 - p)   zeta .55, 353 ms   (overshoots)
     scale    s = .3984 + .6016 * p  zeta 1,   278 ms
     alpha    a = p                  zeta 1,   276 ms
     blur     s = .125 * (1 - p)     zeta .91, 398 ms

   Each is an analytic second-order step response p(t) sampled into a linear()
   easing. Because every channel is linear in p, animating its endpoint with p as
   the easing reproduces the curve exactly. Position needs a spring of its own: it
   overshoots where size and opacity never do.

   Counting down, the arriving glyph enters from above and the departing one leaves
   downward, so the roll travels the way the clock runs. */
.card {
	--roll-entry: .59375em;
	--roll-born: .3984;
	--roll-blur: .125em;
	--roll-delay: 0ms;
	--t-offset: 390ms;
	--t-scale: 300ms;
	--t-alpha: 300ms;
	--t-blur: 398ms;
	--ease-offset: linear(0, 0.014, 0.053, 0.111, 0.183, 0.265, 0.352, 0.443, 0.532, 0.619, 0.702, 0.778, 0.847, 0.908, 0.961, 1.006, 1.043, 1.072, 1.095, 1.11, 1.12, 1.125, 1.126, 1.123, 1.118, 1.11, 1.1, 1.089, 1.078, 1.067, 1.055, 1.045, 1.034, 1.025, 1.017, 1.009, 1.003, 0.998, 0.993, 0.99, 1);
	--ease-scale: linear(0, 0.046, 0.148, 0.271, 0.393, 0.505, 0.603, 0.686, 0.754, 0.808, 0.852, 0.886, 0.913, 0.934, 0.95, 0.962, 0.972, 0.979, 0.984, 0.988, 1);
	--ease-alpha: linear(0, 0.047, 0.15, 0.273, 0.396, 0.509, 0.607, 0.689, 0.757, 0.812, 0.855, 0.889, 0.915, 0.936, 0.951, 0.963, 0.973, 0.98, 0.985, 0.989, 1);
	--ease-blur: linear(0, 0.041, 0.135, 0.253, 0.375, 0.491, 0.594, 0.683, 0.756, 0.816, 0.863, 0.9, 0.929, 0.95, 0.966, 0.977, 0.985, 0.991, 0.995, 0.997, 1);
}

@keyframes roll-in-offset { from { translate: 0 calc(-1 * var(--roll-entry)); } to { translate: 0 0; } }

@keyframes roll-in-scale { from { scale: var(--roll-born); } to { scale: 1; } }

@keyframes roll-in-alpha { from { opacity: 0; } to { opacity: 1; } }

@keyframes roll-in-blur { from { filter: blur(var(--roll-blur)); } to { filter: blur(0); } }

@keyframes roll-out-offset { from { translate: 0 0; } to { translate: 0 var(--roll-entry); } }

@keyframes roll-out-scale { from { scale: 1; } to { scale: var(--roll-born); } }

@keyframes roll-out-alpha { from { opacity: 1; } to { opacity: 0; } }

@keyframes roll-out-blur { from { filter: blur(0); } to { filter: blur(var(--roll-blur)); } }

@keyframes fade-out {
	from { opacity: 1; }
	to { opacity: 0; }
}

/* Backwards fill only, so during the cascade delay the column still shows the
   outgoing glyph at rest and the incoming one has not been born yet. */
@supports (animation-timing-function: linear(0, 1)) {
	.card.is-changing .digit--current,
	.card.is-changing .digit--previous {
		animation-delay: var(--roll-delay);
		animation-fill-mode: backwards;
	}

	.card.is-changing .digit--current {
		animation-name: roll-in-offset, roll-in-scale, roll-in-alpha, roll-in-blur;
		animation-duration: var(--t-offset), var(--t-scale), var(--t-alpha), var(--t-blur);
		animation-timing-function: var(--ease-offset), var(--ease-scale), var(--ease-alpha), var(--ease-blur);
	}

	.card.is-changing .digit--previous {
		animation-name: roll-out-offset, roll-out-scale, roll-out-alpha, roll-out-blur;
		animation-duration: var(--t-offset), var(--t-scale), var(--t-alpha), var(--t-blur);
		animation-timing-function: var(--ease-offset), var(--ease-scale), var(--ease-alpha), var(--ease-blur);
	}
}

/* Older browsers get a plain crossfade instead of the roll. */
@supports not (animation-timing-function: linear(0, 1)) {
	.card.is-changing .digit--previous {
		opacity: 1;
		animation: fade-out var(--fade) cubic-bezier(0, 0, 0.2, 1) forwards;
	}
}

/* Without CSS animations the fading copy would be left showing underneath the new
   digit, so it is dropped and the current digit is shown on its own. */
@supports not (animation-name: fade-out) {
	.digit--previous { display: none; }
}

@supports (background-clip: text) or (-webkit-background-clip: text) {
	.digit::before {
		/* Warm at the top, cool at the bottom, like the two card halves. */
		background-image: linear-gradient(
			180deg,
			var(--digit-1) 0%,
			var(--digit-2) 49.6%,
			var(--digit-3) 50.4%,
			var(--digit-4) 100%
		);
		-webkit-background-clip: text;
		background-clip: text;
		-webkit-text-fill-color: transparent;
		color: transparent;
	}
}

/* The last seconds before the equinox: the clock turns gold. */
#app.is-imminent .card {
	box-shadow:
		0 16px 26px -18px var(--card-shadow),
		0 0 0 1px var(--imminent-ring),
		0 0 42px -6px var(--imminent-glow);
}

#app.is-imminent .digit::before {
	filter: drop-shadow(0 0 12px var(--digit-glow));
}

#app.is-imminent .sky__glow {
	opacity: .9;
}

.progress {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: .55rem;
	width: 30rem;
	width: min(30rem, 84vw);
}

.track {
	width: 100%;
	height: 5px;
	border-radius: 999px;
	background: var(--track);
	overflow: hidden;
}

.track__fill {
	display: block;
	width: 100%;
	height: 100%;
	border-radius: 999px;
	background: var(--track-from);
	background: linear-gradient(90deg, var(--track-from), var(--track-to));
	transform: scaleX(0);
	transform: scaleX(var(--progress));
	transform-origin: right center;
}

.progress__note {
	margin: 0;
	font-size: .76rem;
	/* letter-spacing: .04em; */
	color: #a79fc6;
	color: var(--muted);
}

.banner {
	margin: 0;
	padding: .55rem 1.3rem;
	border: 1px solid var(--gold-border);
	border-radius: 999px;
	background: var(--gold-soft);
	color: #ffc35c;
	color: var(--gold);
	font-size: .95rem;
	font-weight: 700;
	opacity: 0;
	transform: translateY(.4rem);
	transition: opacity .5s, transform .5s;
}

#app.is-nowruz .banner {
	opacity: 1;
	transform: none;
}

.credits {
	position: relative;
	z-index: 1;
	padding: 0 1.25rem 1.75rem;
	font-size: .75rem;
	line-height: 2;
	text-align: center;
	color: #a79fc6;
	color: var(--muted);
}

.credits a {
	color: #7c9cff;
	color: var(--accent);
}

@media (max-width: 30rem) {
	.clock { gap: 1rem 1.1rem; }

	.clock .unit--days { flex: 0 0 100%; }

	.unit__label { font-size: .7rem; letter-spacing: .1em; }
}

@media (prefers-reduced-motion: reduce) {
	.sky__stars,
	.sky__glow { animation: none; }

	/* Keep the crossfade but drop the roll: no travel, no scale, no blur. */
	.card {
		--roll-entry: 0em;
		--roll-born: 1;
		--roll-blur: 0em;
		--t-offset: 90ms;
		--t-scale: 90ms;
		--t-alpha: 90ms;
		--t-blur: 90ms;
	}
}
	</style>
</head>
<body>
	<div id="app">
		<div class="sky" aria-hidden="true">
			<div class="sky__stars"></div>
			<div class="sky__glow"></div>
			<div class="sky__horizon"></div>
		</div>

		<main class="stage">
			<p class="kicker">شمارش معکوس</p>
			<h1 class="title">نوروز <span class="title__year" id="year">––</span></h1>
			<p class="subtitle">
				لحظهٔ اعتدال بهاری: <time id="instant">در حال محاسبه…</time>
			</p>

			<div dir="ltr" class="clock" id="clock" role="timer" aria-live="off" aria-label="شمارش معکوس تا نوروز">
				<div class="unit unit--days">
					<div class="cards">
						<div class="card" id="days-2">
							<span class="shade shade--top" aria-hidden="true"></span>
							<span class="shade shade--bottom" aria-hidden="true"></span>
							<span class="digit digit--previous" data-v="۰" aria-hidden="true"></span>
							<span class="digit digit--current" data-v="۰" aria-hidden="true"></span>
						</div>
						<div class="card" id="days-1">
							<span class="shade shade--top" aria-hidden="true"></span>
							<span class="shade shade--bottom" aria-hidden="true"></span>
							<span class="digit digit--previous" data-v="۰" aria-hidden="true"></span>
							<span class="digit digit--current" data-v="۰" aria-hidden="true"></span>
						</div>
						<div class="card" id="days-0">
							<span class="shade shade--top" aria-hidden="true"></span>
							<span class="shade shade--bottom" aria-hidden="true"></span>
							<span class="digit digit--previous" data-v="۰" aria-hidden="true"></span>
							<span class="digit digit--current" data-v="۰" aria-hidden="true"></span>
						</div>
					</div>
					<span class="unit__label">روز<small>days</small></span>
				</div>

				<div class="unit">
					<div class="cards">
						<div class="card" id="hours-1">
							<span class="shade shade--top" aria-hidden="true"></span>
							<span class="shade shade--bottom" aria-hidden="true"></span>
							<span class="digit digit--previous" data-v="۰" aria-hidden="true"></span>
							<span class="digit digit--current" data-v="۰" aria-hidden="true"></span>
						</div>
						<div class="card" id="hours-0">
							<span class="shade shade--top" aria-hidden="true"></span>
							<span class="shade shade--bottom" aria-hidden="true"></span>
							<span class="digit digit--previous" data-v="۰" aria-hidden="true"></span>
							<span class="digit digit--current" data-v="۰" aria-hidden="true"></span>
						</div>
					</div>
					<span class="unit__label">ساعت<small>hours</small></span>
				</div>

				<div class="unit">
					<div class="cards">
						<div class="card" id="minutes-1">
							<span class="shade shade--top" aria-hidden="true"></span>
							<span class="shade shade--bottom" aria-hidden="true"></span>
							<span class="digit digit--previous" data-v="۰" aria-hidden="true"></span>
							<span class="digit digit--current" data-v="۰" aria-hidden="true"></span>
						</div>
						<div class="card" id="minutes-0">
							<span class="shade shade--top" aria-hidden="true"></span>
							<span class="shade shade--bottom" aria-hidden="true"></span>
							<span class="digit digit--previous" data-v="۰" aria-hidden="true"></span>
							<span class="digit digit--current" data-v="۰" aria-hidden="true"></span>
						</div>
					</div>
					<span class="unit__label">دقیقه<small>minutes</small></span>
				</div>

				<div class="unit">

	<script>
		/*
		 * Offline support, and a page that does not go stale.
		 *
		 * The worker itself is the version marker: the build stamps a digest of the page into
		 * sw.js, so every deploy gives the browser a sw.js it has not seen, which installs a
		 * new worker, fills a new cache and drops the old one. The browser looks for that on
		 * its own when the page is opened; the timer and the visibility check below are for a
		 * page that is left open, since a countdown can sit in a tab for days.
		 *
		 * When a new worker takes over a page that was already controlled, a new version is
		 * live, so the page reloads once to run it. The first install claims the page too, and
		 * there is nothing to refresh then.
		 *
		 * Not on a development server: a cached bundle there would keep serving stale files
		 * while the page is being worked on.
		 */
		if ('serviceWorker' in navigator &&
			location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
			var hadController = !!navigator.serviceWorker.controller;
			var reloading = false;
			navigator.serviceWorker.addEventListener('controllerchange', function () {
				if (!hadController || reloading) return;
				reloading = true;
				location.reload();
			});

			navigator.serviceWorker.register('sw.js').then(function (registration) {
				function checkForUpdate() {
					registration.update();
				}
				setInterval(checkForUpdate, 60 * 60 * 1000);
				document.addEventListener('visibilitychange', function () {
					if (document.visibilityState === 'visible') checkForUpdate();
				});
			});
		}
	</script>
