<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Equinox">
	<defs>
		<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#05060f"/>
			<stop offset=".45" stop-color="#140d29"/>
			<stop offset=".78" stop-color="#2b1039"/>
			<stop offset="1" stop-color="#4a1636"/>
